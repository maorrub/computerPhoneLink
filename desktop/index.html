<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Screen Streamer Client</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #stream {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <video id="stream" autoplay muted playsinline></video>
  <script src="./renderer.js"></script>
</body>
</html>
